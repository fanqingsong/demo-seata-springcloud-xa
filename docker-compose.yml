name: demo-seata-springcloud

x-app: &app
  image: demo-seata-springcloud:0.0.1
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  restart: on-failure

x-java-env: &java-env
  EUREKA_HOST: eureka
  EUREKA_PREFER_IP: "true"
  MYSQL_HOST: mysql
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: "123456"
  JAVA_OPTS: "-Xms128m -Xmx384m"
  JAVA_TOOL_OPTIONS: "-DSEATA_GROUP_LIST=seata-server:8091"

services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: fescardubbo
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  seata-admin:
    image: demo-seata-admin:0.0.1
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: "123456"
    ports:
      - "7091:7091"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7091/api/sessions >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  seata-server:
    image: demo-seata-server:0.6.1
    build:
      context: .
      dockerfile: docker/seata.Dockerfile
    ports:
      - "8092:8091"
    depends_on:
      mysql:
        condition: service_healthy
      seata-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  eureka:
    <<: *app
    environment:
      <<: *java-env
      APP_JAR: eureka.jar
      EUREKA_HOSTNAME: eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8761/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  account:
    <<: *app
    environment:
      <<: *java-env
      APP_JAR: account.jar
    ports:
      - "9100:9100"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
      seata-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9100/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  order:
    <<: *app
    environment:
      <<: *java-env
      APP_JAR: order.jar
    ports:
      - "9200:9200"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
      seata-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9200/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  storage:
    <<: *app
    environment:
      <<: *java-env
      APP_JAR: storage.jar
    ports:
      - "9300:9300"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
      seata-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9300/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  business:
    <<: *app
    environment:
      <<: *java-env
      APP_JAR: business.jar
    ports:
      - "7100:7100"
    depends_on:
      eureka:
        condition: service_healthy
      seata-server:
        condition: service_healthy
      account:
        condition: service_healthy
      order:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:7100/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    <<: *app
    environment:
      <<: *java-env
      APP_JAR: web.jar
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
      business:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  mysql-data:
