<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>Seata Admin</title>
	<style>
		* { box-sizing: border-box; }
		body {
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			margin: 0;
			padding: 1.5rem;
			color: #1a1a1a;
			background: #f8fafc;
		}
		h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
		p.sub { color: #555; margin: 0 0 1.25rem; }
		section { margin-bottom: 1.5rem; }
		h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
		.wrap { overflow-x: auto; background: #fff; border-radius: 8px; }
		table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
		th, td { padding: 0.45rem 0.6rem; border-bottom: 1px solid #e5e7eb; text-align: left; white-space: nowrap; }
		th { background: #f1f5f9; }
		.empty { color: #888; padding: 0.75rem; }
		a { color: #2563eb; }
	</style>
</head>
<body>
	<h1>Seata Admin</h1>
	<p class="sub">查看 Seata 0.6.1 的全局事务和分支事务。事务结束后会从活动表归档到历史表。页面每 3 秒刷新。<a href="/api/sessions">JSON</a></p>
	<section>
		<h2>活动全局事务</h2>
		<div class="wrap" id="activeGlobals"></div>
	</section>
	<section>
		<h2>活动分支事务</h2>
		<div class="wrap" id="activeBranches"></div>
	</section>
	<section>
		<h2>历史全局事务</h2>
		<div class="wrap" id="historyGlobals"></div>
	</section>
	<section>
		<h2>历史分支事务</h2>
		<div class="wrap" id="historyBranches"></div>
	</section>
	<script>
		var columns = {
			activeGlobals: ["xid", "transaction_id", "statusName", "application_id", "transaction_name", "timeout", "begin_time", "gmt_create"],
			activeBranches: ["branch_id", "xid", "statusName", "branch_type", "resource_id", "client_id", "gmt_create"],
			historyGlobals: ["xid", "transaction_id", "statusName", "application_id", "transaction_name", "archived_at", "gmt_modified"],
			historyBranches: ["branch_id", "xid", "statusName", "branch_type", "resource_id", "archived_at"]
		};

		function text(value) {
			if (value === null || value === undefined) {
				return "";
			}
			return String(value);
		}

		function render(id, rows) {
			var el = document.getElementById(id);
			var fields = columns[id];
			if (!rows || rows.length === 0) {
				el.innerHTML = '<div class="empty">暂无记录</div>';
				return;
			}
			var html = "<table><thead><tr>";
			fields.forEach(function (field) {
				html += "<th>" + field + "</th>";
			});
			html += "</tr></thead><tbody>";
			rows.forEach(function (row) {
				html += "<tr>";
				fields.forEach(function (field) {
					html += "<td>" + text(row[field]).replace(/[&<>]/g, function (ch) {
						return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch];
					}) + "</td>";
				});
				html += "</tr>";
			});
			html += "</tbody></table>";
			el.innerHTML = html;
		}

		function load() {
			fetch("/api/sessions").then(function (res) { return res.json(); }).then(function (data) {
				Object.keys(columns).forEach(function (id) { render(id, data[id]); });
			}).catch(function () {});
		}

		load();
		setInterval(load, 3000);
	</script>
</body>
</html>
